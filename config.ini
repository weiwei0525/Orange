; ================================================================
;  有田有米・有園有果  網站設定檔
;  ・存檔請用 UTF-8 編碼（記事本「另存新檔」→ 編碼選 UTF-8）
;  ・分號 ; 或 # 開頭的那行是註解，不會被讀取
;  ・改完存檔、上傳覆蓋主機上的 config.ini，重新整理網頁就生效
;  ・也可以用 admin.html 開啟這個檔案，用表單介面修改
; ================================================================

; ----------------------------------------------------------------
;  訂單後台（Google 試算表 + Apps Script），作法見 README.md
;  url 填了之後：商品、價格、庫存、公告、匯款帳號都改從試算表讀取，
;  下單會即時檢查並扣庫存。下面的 [site] [payment] [product.*] 變成備用值。
;  url 留空：維持舊做法，用這個檔案的設定 + Google 表單接單。
; ----------------------------------------------------------------
[api]
url = https://script.google.com/macros/s/AKfycbxKWfpN5UVT4_4mJUcjOr3LzyN_IVK4quRgIxvhNHN0e7hQBI32PrA9wqR-C1d4hxW6/exec

[site]
season_badge = 2026 季節限定・陸續出貨中
; 網站上方的公告列，留空就不顯示
notice = 出貨節奏會依照採收狀態，需要大家耐心等待一下！
; open = 1 開放訂購；open = 0 關閉訂購（顯示下面的結束訊息）
open = 1
closed_message = 本季椪柑已全數售完，感謝大家的支持！明年見 🍊
; 庫存剩多少箱以下時顯示「即將售完」
low_stock = 5
; 首頁大圖（圓形），留空則顯示畫的橘子。照片請放在 assets/img/ 資料夾
hero_image =

; ----------------------------------------------------------------
;  果園日常相簿：photo1、photo2… 依序排列，格式「檔案路徑 | 說明文字」
;  全部留空時，相簿區塊不會顯示
; ----------------------------------------------------------------
[gallery]
subtitle = 從採收到裝箱，每一顆都是農婦親手挑的
photo1 = assets/img/orchard.jpg | 草生栽培的椪柑園，不噴除草劑、手工割草
photo2 = assets/img/harvest-cart.jpg | 滿滿一車剛採收的椪柑
photo3 = assets/img/farmer-orange.jpg | 農婦手上這顆，已經開始轉黃囉
photo4 = assets/img/harvest-dusk.jpg | 趁天涼的時候上工採收
photo5 = assets/img/farmer-ripe.jpg | 樹上的大顆椪柑
photo6 = assets/img/not-ripe.jpg | 還沒成熟的椪柑，不要上當！
photo7 = assets/img/farmer-trees.jpg | 東勢山坡上的椪柑樹
photo8 = assets/img/farmer-look.jpg | 一顆一顆看，挑熟的才剪

[payment]
bank_name = 中國信託（822）
bank_account = 7275-4024-6908
account_holder = 吳佳玲
phone_transfer = 0987762621
line_id = mavis2731

; ----------------------------------------------------------------
;  商品：每個商品一個 [product.代號] 區塊，代號隨意取（英數字）
;  name   商品名稱
;  spec   規格說明
;  price  單價（元，含運）
;  stock  庫存箱數（0 = 售完）
;  max    單筆最多可訂幾箱（Google 表單選項目前只有 1~10，請勿超過 10）
;  badge  角標文字（例：人氣、限量），留空不顯示
;  size   圖示大小：big 大顆 / small 小顆
;  entry  對應 Google 表單「數量」題目的欄位 ID（新增商品時要在表單加題目）
;  image  商品照片路徑（例：assets/img/p23.jpg），建議 4:3 橫式
;  enabled  1 顯示 / 0 隱藏
; ----------------------------------------------------------------

[product.p23]
name = 級數 23
spec = 25 斤裝・約 72 顆上下
price = 1000
stock = 30
max = 10
badge = 人氣
size = big
entry = entry.1401373399
; 商品照片，留空則顯示畫的橘子
image = assets/img/p23.jpg
enabled = 1

[product.mini]
name = 級數 小小橘
spec = 25 斤裝・顆數多、小巧好剝
price = 750
stock = 20
max = 10
badge =
size = small
entry = entry.942156688
image = assets/img/mini.jpg
enabled = 1

; ----------------------------------------------------------------
;  訂購用 Google 表單（目前那份「2026有田有米·有園有果」）
;  一般不需要改，除非換了新表單
; ----------------------------------------------------------------
[form]
action = https://docs.google.com/forms/d/e/1FAIpQLScLAl-O51Q4Q6W6WsdTEI-1qL_B8FPZtDdHSnlrTSz-N2pggQ/formResponse
view_url = https://docs.google.com/forms/d/e/1FAIpQLScLAl-O51Q4Q6W6WsdTEI-1qL_B8FPZtDdHSnlrTSz-N2pggQ/viewform
name = entry.1649849662
phone = entry.429322369
address = entry.1739468826
contact = entry.908422164
time = entry.196000758
last5 = entry.811424291
; 收件時間選項，必須和 Google 表單上的文字「完全一樣」，用 | 分隔
time_options = 平日|週六|平日周六都可以|出貨時間需要參詳(討論)一下
; 選「稍後匯款」時，末五碼欄位要送出的文字
later_text = 待匯款

; ----------------------------------------------------------------
;  匯款通知用的 Google 表單（另外建一份，作法見 README.md）
;  action 留空時，「送出匯款通知」會改成用 LINE 傳訊息給農婦
; ----------------------------------------------------------------
[notify]
action =
name =
phone =
amount =
last5 =
method =

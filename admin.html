<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>商品與庫存設定｜有田有米</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #fffaf3; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .topbar { background: #3f6b3a; color: #fff; position: sticky; top: 0; z-index: 10; }
    .card { border: 0; border-radius: 16px; box-shadow: 0 6px 20px rgba(120,70,20,.08); }
    .prod-card { border-left: 5px solid #f08a24; }
    .prod-card.off { opacity: .55; border-left-color: #aaa; }
    .stock-box { display: flex; align-items: center; gap: .3rem; }
    .stock-box input { width: 90px; text-align: center; font-weight: 700; font-size: 1.2rem; }
    .btn-orange { background: #f08a24; color: #fff; border: 0; }
    .btn-orange:hover { background: #d96f0c; color: #fff; }
    .dirty-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ffc107; margin-right: .3rem; }
    .kv-label { font-family: monospace; font-size: .85rem; color: #7a726a; }
    textarea.raw { font-family: Consolas, monospace; font-size: .85rem; }
  </style>
</head>
<body>

<div class="topbar py-2">
  <div class="container d-flex flex-wrap align-items-center gap-2">
    <strong class="me-auto"><i class="bi bi-gear"></i> 有田有米・商品與庫存設定</strong>
    <span id="fileName" class="small opacity-75">尚未開啟檔案</span>
    <span id="dirty" class="small" hidden><span class="dirty-dot"></span>尚未儲存</span>
    <button class="btn btn-light btn-sm" id="btnOpen"><i class="bi bi-folder2-open"></i> 開啟 config.ini</button>
    <button class="btn btn-warning btn-sm fw-bold" id="btnSave" disabled><i class="bi bi-save"></i> 儲存</button>
  </div>
</div>
<input type="file" id="filePick" accept=".ini,text/plain" hidden>

<div class="container py-4" style="max-width: 980px;">
  <div id="intro" class="card p-4 text-center">
    <h1 class="h4 fw-bold">使用說明</h1>
    <p class="text-muted mb-3">按上方「開啟 config.ini」選擇網站資料夾裡的 <code>config.ini</code>，修改後按「儲存」。<br>
      建議用 <strong>Chrome 或 Edge</strong>，可以直接寫回原檔案；其他瀏覽器會改成下載新檔案，再手動覆蓋。<br>
      存檔後記得把 <code>config.ini</code> 上傳到網站主機。</p>
    <div><button class="btn btn-orange btn-lg" onclick="$('#btnOpen').click()"><i class="bi bi-folder2-open"></i> 開啟 config.ini</button></div>
  </div>

  <div id="editor" hidden>
    <ul class="nav nav-pills mb-3" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabProducts">商品 / 庫存</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabSite">網站與付款</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabForm">表單設定</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabRaw">原始檔</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tabProducts">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check form-switch fs-5">
            <input class="form-check-input" type="checkbox" id="siteOpen">
            <label class="form-check-label fw-bold" for="siteOpen">開放訂購</label>
          </div>
          <button class="btn btn-outline-success btn-sm" id="btnAdd"><i class="bi bi-plus-lg"></i> 新增商品</button>
        </div>
        <div id="prodList"></div>
      </div>
      <div class="tab-pane fade" id="tabSite"><div id="siteFields"></div></div>
      <div class="tab-pane fade" id="tabForm">
        <div class="alert alert-info small">欄位 ID 是 <code>entry.數字</code> 格式。匯款通知表單的建立方法請看 README.md。</div>
        <div id="formFields"></div>
      </div>
      <div class="tab-pane fade" id="tabRaw">
        <p class="small text-muted">儲存時會寫出的內容（保留原本的註解）：</p>
        <textarea class="form-control raw" id="rawView" rows="24" readonly></textarea>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast text-bg-dark border-0"><div class="toast-body" id="toastText"></div></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/ini.js?v=202611240940"></script>
<script>
(function ($) {
  'use strict';
  var rawText = '', data = {}, handle = null, fileName = 'config.ini', dirty = false;

  var PROD_FIELDS = [
    ['name', '商品名稱', 'text', 'col-md-6'], ['spec', '規格說明', 'text', 'col-md-6'],
    ['price', '單價（含運）', 'number', 'col-6 col-md-3'], ['max', '單筆上限', 'number', 'col-6 col-md-3'],
    ['badge', '角標', 'text', 'col-6 col-md-3'], ['size', '圖示', 'select', 'col-6 col-md-3'],
    ['entry', 'Google 表單欄位 ID', 'text', 'col-md-6'], ['image', '商品照片（例 assets/img/p23.jpg）', 'text', 'col-md-6']
  ];
  var LABELS = {
    'site.season_badge': '首頁標籤', 'site.notice': '公告列（留空不顯示）', 'site.closed_message': '關閉訂購時顯示',
    'site.low_stock': '剩幾箱以下顯示「即將售完」', 'site.open': '開放訂購（1/0）',
    'payment.bank_name': '銀行', 'payment.bank_account': '帳號', 'payment.account_holder': '戶名',
    'payment.phone_transfer': '手機轉帳號碼', 'payment.line_id': 'LINE ID', 'site.hero_image': '首頁大圖', 'gallery.subtitle': '相簿副標題'
  };

  function toast(t) { $('#toastText').text(t); bootstrap.Toast.getOrCreateInstance('#toast', { delay: 2000 }).show(); }
  function esc(s) { return $('<div>').text(s == null ? '' : s).html(); }
  function setDirty(v) { dirty = v; $('#dirty').prop('hidden', !v); refreshRaw(); }
  function refreshRaw() { $('#rawView').val(INI.update(rawText, data)); }

  /* ---- 開檔 ---- */
  $('#btnOpen').on('click', async function () {
    if (dirty && !window.confirm('目前的修改尚未儲存，確定要開啟其他檔案？')) return;
    if (window.showOpenFilePicker) {
      try {
        var hs = await window.showOpenFilePicker({ types: [{ description: 'INI 設定檔', accept: { 'text/plain': ['.ini'] } }] });
        handle = hs[0];
        var f = await handle.getFile();
        load(await f.text(), f.name);
      } catch (e) { if (e.name !== 'AbortError') toast('開啟失敗：' + e.message); }
    } else {
      $('#filePick').val('').trigger('click');
    }
  });
  $('#filePick').on('change', function () {
    var f = this.files[0]; if (!f) return;
    handle = null;
    var r = new FileReader();
    r.onload = function () { load(r.result, f.name); };
    r.readAsText(f, 'utf-8');
  });

  function load(text, name) {
    rawText = text; data = INI.parse(text); fileName = name;
    $('#fileName').text(name + (handle ? '' : '（儲存時會下載新檔）'));
    $('#intro').prop('hidden', true); $('#editor').prop('hidden', false);
    $('#btnSave').prop('disabled', false);
    data.site = data.site || {};
    renderAll(); setDirty(false);
  }

  /* ---- 存檔 ---- */
  $('#btnSave').on('click', async function () {
    var out = INI.update(rawText, data);
    try {
      if (handle) {
        var w = await handle.createWritable();
        await w.write(out); await w.close();
        toast('已儲存到 ' + fileName);
      } else {
        var url = URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF) + out], { type: 'text/plain;charset=utf-8' }));
        $('<a>').attr({ href: url, download: 'config.ini' })[0].click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        toast('已下載 config.ini，請覆蓋網站資料夾中的檔案');
      }
      rawText = out; setDirty(false);
    } catch (e) { toast('儲存失敗：' + e.message); }
  });
  $(window).on('beforeunload', function () { if (dirty) return '尚未儲存'; });
  $(document).on('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (!$('#btnSave').prop('disabled')) $('#btnSave').click(); }
  });

  /* ---- 畫面 ---- */
  function prodKeys() { return Object.keys(data).filter(function (k) { return k.indexOf('product.') === 0; }); }

  function renderAll() {
    $('#siteOpen').prop('checked', data.site.open !== '0');
    renderProducts();
    renderKV('#siteFields', ['site', 'payment', 'gallery'], ['open']);
    renderKV('#formFields', ['form', 'notify'], []);
  }

  function renderProducts() {
    var $l = $('#prodList').empty();
    prodKeys().forEach(function (sec) {
      var p = data[sec], id = sec.slice(8), on = p.enabled !== '0';
      var fields = PROD_FIELDS.map(function (f) {
        var input = f[2] === 'select'
          ? '<select class="form-select form-select-sm" data-k="' + f[0] + '"><option value="big">大顆</option><option value="small">小顆</option></select>'
          : '<input class="form-control form-control-sm" type="' + f[2] + '" data-k="' + f[0] + '" value="' + esc(p[f[0]]) + '">';
        return '<div class="' + f[3] + '"><label class="form-label small mb-1">' + f[1] + '</label>' + input + '</div>';
      }).join('');
      var $c = $(
        '<div class="card prod-card p-3 mb-3' + (on ? '' : ' off') + '" data-sec="' + esc(sec) + '">' +
          '<div class="d-flex flex-wrap align-items-center gap-3 mb-3">' +
            '<h2 class="h5 fw-bold mb-0 me-auto">' + esc(p.name || id) + ' <small class="text-muted fw-normal">[' + esc(id) + ']</small></h2>' +
            '<div class="stock-box"><span class="small me-1">庫存</span>' +
              '<button class="btn btn-outline-secondary btn-sm" data-st="-1"><i class="bi bi-dash"></i></button>' +
              '<input class="form-control" type="number" min="0" data-k="stock" value="' + esc(p.stock || 0) + '">' +
              '<button class="btn btn-outline-secondary btn-sm" data-st="1"><i class="bi bi-plus"></i></button>' +
              '<button class="btn btn-outline-danger btn-sm ms-1" data-st="zero">售完</button></div>' +
            '<div class="form-check form-switch mb-0"><input class="form-check-input en" type="checkbox"' + (on ? ' checked' : '') + '><label class="form-check-label small">上架</label></div>' +
            '<button class="btn btn-link text-danger btn-sm del" title="刪除"><i class="bi bi-trash"></i></button>' +
          '</div>' +
          '<div class="row g-2">' + fields + '</div>' +
        '</div>');
      $c.find('select[data-k="size"]').val(p.size === 'small' ? 'small' : 'big');
      $l.append($c);
    });
    if (!prodKeys().length) $l.html('<p class="text-muted text-center py-4">還沒有商品，按「新增商品」。</p>');
  }

  function renderKV(target, sections, skip) {
    var $t = $(target).empty();
    sections.forEach(function (sec) {
      if (!data[sec]) return;
      var rows = Object.keys(data[sec]).filter(function (k) { return skip.indexOf(k) < 0; }).map(function (k) {
        return '<div class="col-md-6"><label class="form-label small mb-1">' + esc(LABELS[sec + '.' + k] || k) +
          ' <span class="kv-label">' + esc(k) + '</span></label>' +
          '<input class="form-control form-control-sm kv" data-sec="' + sec + '" data-k="' + esc(k) + '" value="' + esc(data[sec][k]) + '"></div>';
      }).join('');
      $t.append('<div class="card p-3 mb-3"><h2 class="h6 fw-bold">[' + sec + ']</h2><div class="row g-2">' + rows + '</div></div>');
    });
  }

  /* ---- 編輯事件 ---- */
  $('#siteOpen').on('change', function () { data.site.open = this.checked ? '1' : '0'; setDirty(true); });

  $(document).on('input change', '.prod-card [data-k]', function () {
    var sec = $(this).closest('.prod-card').data('sec'), k = $(this).data('k'), v = $(this).val();
    if (k === 'stock') v = String(Math.max(0, parseInt(v, 10) || 0));
    data[sec][k] = v;
    if (k === 'name') $(this).closest('.prod-card').find('h2').contents().first().replaceWith(v + ' ');
    setDirty(true);
  });
  $(document).on('click', '[data-st]', function () {
    var $i = $(this).closest('.stock-box').find('input'), st = $(this).data('st');
    var v = st === 'zero' ? 0 : Math.max(0, (parseInt($i.val(), 10) || 0) + Number(st));
    $i.val(v).trigger('change');
  });
  $(document).on('change', '.prod-card .en', function () {
    var $c = $(this).closest('.prod-card');
    data[$c.data('sec')].enabled = this.checked ? '1' : '0';
    $c.toggleClass('off', !this.checked); setDirty(true);
  });
  $(document).on('click', '.prod-card .del', function () {
    var sec = $(this).closest('.prod-card').data('sec');
    if (!window.confirm('確定刪除「' + (data[sec].name || sec) + '」？')) return;
    delete data[sec]; renderProducts(); setDirty(true);
  });
  $(document).on('input', '.kv', function () { data[$(this).data('sec')][$(this).data('k')] = $(this).val(); setDirty(true); });

  $('#btnAdd').on('click', function () {
    var id = (window.prompt('商品代號（英文或數字，例如 p25）') || '').trim();
    if (!id) return;
    if (!/^[A-Za-z0-9_-]+$/.test(id)) { toast('代號只能用英文、數字、底線'); return; }
    if (data['product.' + id]) { toast('代號已存在'); return; }
    data['product.' + id] = { name: '新商品', spec: '', price: '0', stock: '0', max: '10', badge: '', size: 'big', entry: '', image: '', enabled: '0' };
    renderProducts(); setDirty(true);
    toast('已新增（預設未上架）。記得到 Google 表單加數量題目並填入欄位 ID');
  });
})(jQuery);
</script>
</body>
</html>
